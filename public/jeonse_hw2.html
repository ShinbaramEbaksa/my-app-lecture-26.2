<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>서울 전세가 조회</title>

  <link rel="stylesheet" href="https://pyscript.net/releases/2025.8.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2025.8.1/core.js"></script>

  <style>
    :root {
      --orange: #FF9500;
      --orange-deep: #E07B00;
      --ink: #1c1c1e;
      --ink-soft: #6b6b70;
      --glass: rgba(255, 255, 255, 0.55);
      --glass-strong: rgba(255, 255, 255, 0.78);
      --edge: rgba(255, 255, 255, 0.85);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 48px 20px 64px;
      color: var(--ink);
      background: #f2f1f6;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
                   "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow-x: hidden;
    }

    /* 유리 뒤에서 번지는 색 덩어리 */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.55;
      pointer-events: none;
      z-index: 0;
    }
    .blob.one   { width: 380px; height: 380px; background: #FFB340; top: -90px; left: -60px; }
    .blob.two   { width: 320px; height: 320px; background: #FF7A5A; top: 180px; right: -90px; }
    .blob.three { width: 420px; height: 420px; background: #7FC8FF; bottom: -140px; left: 20%; }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
    }

    header {
      padding: 0 6px 22px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.4px;
    }

    .sub {
      margin: 0;
      font-size: 15px;
      color: var(--ink-soft);
      line-height: 1.5;
    }

    .card {
      background: var(--glass);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border: 1px solid var(--edge);
      border-radius: 26px;
      box-shadow: 0 8px 32px rgba(31, 38, 60, 0.12),
                  inset 0 1px 0 rgba(255, 255, 255, 0.6);
      padding: 8px;
      margin-bottom: 18px;
    }

    .field {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(60, 60, 67, 0.1);
    }

    .field:last-child { border-bottom: none; }

    .field label {
      flex-shrink: 0;
      font-size: 16px;
      font-weight: 500;
    }

    .picker {
      position: relative;
      flex: 1;
      max-width: 62%;
    }

    select {
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
      padding: 9px 34px 9px 14px;
      font-size: 16px;
      font-family: inherit;
      color: var(--ink);
      background: rgba(118, 118, 128, 0.12);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-align: right;
      direction: rtl;
    }

    select:focus {
      outline: 2px solid var(--orange);
      outline-offset: 1px;
    }

    select:disabled {
      color: rgba(60, 60, 67, 0.3);
      cursor: not-allowed;
    }

    .chev {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(60, 60, 67, 0.45);
      font-size: 13px;
      pointer-events: none;
    }

    .result {
      background: var(--glass-strong);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border: 1px solid var(--edge);
      border-radius: 26px;
      box-shadow: 0 8px 32px rgba(31, 38, 60, 0.12),
                  inset 0 1px 0 rgba(255, 255, 255, 0.7);
      padding: 28px 24px;
      text-align: center;
    }

    .place {
      font-size: 14px;
      color: var(--ink-soft);
      margin-bottom: 10px;
    }

    .price {
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -1px;
      color: var(--orange-deep);
      line-height: 1.15;
    }

    .unit {
      display: block;
      margin-top: 8px;
      font-size: 13px;
      color: var(--ink-soft);
    }

    .count {
      display: inline-block;
      margin-top: 16px;
      padding: 5px 13px;
      border-radius: 999px;
      background: rgba(255, 149, 0, 0.16);
      color: var(--orange-deep);
      font-size: 13px;
      font-weight: 500;
    }

    .hint {
      padding: 34px 10px;
      text-align: center;
      color: var(--ink-soft);
      font-size: 15px;
      line-height: 1.6;
    }

    footer {
      margin-top: 26px;
      text-align: center;
      font-size: 12px;
      color: rgba(60, 60, 67, 0.45);
      line-height: 1.7;
    }

    footer a { color: inherit; }

    @media (max-width: 380px) {
      h1 { font-size: 26px; }
      .price { font-size: 32px; }
      .picker { max-width: 58%; }
    }
  </style>
</head>

<body>
  <div class="blob one"></div>
  <div class="blob two"></div>
  <div class="blob three"></div>

  <div class="wrap">
    <header>
      <h1>서울 전세가 조회</h1>
      <p class="sub">자치구와 법정동, 주택 유형을 고르면<br>2026년 평균 전세 보증금을 알려 드립니다.</p>
    </header>

    <div class="card">
      <div class="field">
        <label for="gu">자치구</label>
        <span class="picker">
          <select id="gu" py-change="on_gu"></select>
          <span class="chev">&#9662;</span>
        </span>
      </div>
      <div class="field">
        <label for="dong">법정동</label>
        <span class="picker">
          <select id="dong" py-change="on_dong" disabled></select>
          <span class="chev">&#9662;</span>
        </span>
      </div>
      <div class="field">
        <label for="usg">주택 유형</label>
        <span class="picker">
          <select id="usg" py-change="on_usg" disabled></select>
          <span class="chev">&#9662;</span>
        </span>
      </div>
    </div>

    <div class="result" id="result">
      <div class="hint">불러오는 중입니다.</div>
    </div>

    <footer>
      출처: 서울 열린데이터 광장 · 서울시 부동산 전월세가 정보<br>
      2026년 전세 계약 기준 평균 보증금
    </footer>
  </div>

# 보증금을 억과 만원으로 읽기 좋게 바꾸는 함수
def format_money(value):
    total = int(round(value))
    eok = total // 10000
    man = total % 10000
    if eok > 0:
        if man > 0:
            text = f"{eok}억 {man:,}만원"
        else:
            text = f"{eok}억원"
    else:
        text = f"{man:,}만원"
    return text


# 선택 상자를 채우는 함수
def fill(select_id, items, placeholder):
    box = document.querySelector("#" + select_id)
    html = f"<option value=''>{placeholder}</option>"
    for i in range(len(items)):
        html = html + f"<option value='{items[i]}'>{items[i]}</option>"
    box.innerHTML = html
    box.disabled = len(items) == 0


# 결과 칸을 안내 문구로 되돌리는 함수
def show_hint(message):
    document.querySelector("#result").innerHTML = f"<div class='hint'>{message}</div>"


# 고른 조건의 평균 전세가를 화면에 그리는 함수
def show_price(gu, dong, usg):
    row = DATA[gu][dong][usg]
    price = format_money(row[0])
    count = row[1]
    html = f"<div class='place'>{gu} {dong} · {usg}</div>"
    html = html + f"<div class='price'>{price}</div>"
    html = html + f"<span class='unit'>평균 전세 보증금</span>"
    html = html + f"<div><span class='count'>거래 {count:,}건</span></div>"
    document.querySelector("#result").innerHTML = html


def value_of(select_id):
    return document.querySelector("#" + select_id).value

    gu = value_of("gu")
    if gu == "":
        fill("dong", [], "자치구 먼저")
