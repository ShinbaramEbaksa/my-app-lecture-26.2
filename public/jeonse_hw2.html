<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>서울 전세가 지도</title>

  <link rel="stylesheet" href="https://pyscript.net/releases/2025.8.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2025.8.1/core.js"></script>

  <style>
    :root {
      --accent: #C2660A;
      --ink: #1c1c1e;
      --ink-2: #48484a;
      --ink-3: #6b6b70;
      --ink-4: rgba(60,60,67,.45);
      --glass: rgba(255,255,255,.72);
      --edge: rgba(255,255,255,.9);
      --rule: rgba(60,60,67,.1);
      --shadow: 0 10px 40px rgba(31,38,60,.18);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background: #eceef2;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
                   "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── 배경 지도 ── */
    #maplayer { position: fixed; inset: 0; z-index: 0; }
    #maplayer svg { width: 100%; height: 100%; display: block; }
    .gu { stroke: #ffffff; stroke-width: 1.5; cursor: pointer;
          transition: fill .15s ease; }
    .gu:hover { stroke: var(--ink-2); stroke-width: 2.5; }
    .gu.sel { stroke: #1c1c1e; stroke-width: 3; }
    .gu-label { fill: var(--ink-2); font-size: 11px; font-weight: 600; pointer-events: none;
                paint-order: stroke; stroke: rgba(255,255,255,.85); stroke-width: 3px; }

    .glass {
      background: var(--glass);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--edge);
      box-shadow: var(--shadow);
    }

    /* ── 좌측 검색 패널 ── */
    #panel {
      position: fixed; z-index: 3; top: 16px; left: 16px; width: 300px;
      border-radius: 16px; overflow: hidden;
    }
    .tabs { display: flex; gap: 4px; padding: 8px 8px 0; }
    .tab {
      flex: 1; padding: 8px 6px; border: none; border-radius: 9px;
      background: transparent; color: var(--ink-3);
      font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .tab.on { background: var(--accent); color: #fff; }
    .pane { padding: 10px 12px 12px; }
    .pane[hidden] { display: none; }

    .searchbox { position: relative; }
    .searchbox input {
      width: 100%; padding: 10px 12px; font-size: 15px; font-family: inherit;
      color: var(--ink); background: rgba(118,118,128,.12);
      border: 1px solid transparent; border-radius: 10px;
    }
    .searchbox input:focus { outline: none; border-color: var(--accent); background: #fff; }
    .results { margin-top: 8px; max-height: 262px; overflow-y: auto; }
    .result {
      display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
      padding: 9px 10px; border-radius: 9px; cursor: pointer; font-size: 14px;
    }
    .result:hover { background: rgba(194,102,10,.12); }
    .result .r-sub { font-size: 11.5px; color: var(--ink-4); flex-shrink: 0; }
    .result em { font-style: normal; color: var(--accent); font-weight: 700; }
    .empty { padding: 14px 4px; font-size: 13px; color: var(--ink-4); text-align: center; }

    .field { display: flex; align-items: center; justify-content: space-between;
             gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--rule); }
    .field:last-child { border-bottom: none; }
    .field label { font-size: 14px; font-weight: 500; flex-shrink: 0; }
    .picker { position: relative; flex: 1; max-width: 64%; }
    select {
      width: 100%; appearance: none; -webkit-appearance: none;
      padding: 8px 28px 8px 11px; font-size: 14px; font-family: inherit;
      color: var(--ink); background: rgba(118,118,128,.12);
      border: none; border-radius: 9px; cursor: pointer; text-align: right; direction: rtl;
    }
    select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    select:disabled { color: rgba(60,60,67,.3); cursor: not-allowed; }
    .chev { position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            color: rgba(60,60,67,.45); font-size: 12px; pointer-events: none; }

    /* ── 범례 ── */
    #legend {
      position: fixed; z-index: 2; left: 16px; bottom: 16px;
      padding: 9px 12px; border-radius: 12px; font-size: 11px; color: var(--ink-3);
      display: flex; align-items: center; gap: 7px;
    }
    #legend .steps { display: flex; gap: 2px; }
    #legend .steps span { width: 26px; height: 9px; border-radius: 2px; }

    /* ── 결과 팝업 ── */
    #popup {
      position: fixed; z-index: 4; top: 16px; right: 16px; bottom: 16px; width: 396px;
      border-radius: 18px; display: flex; flex-direction: column; overflow: hidden;
    }
    #popup[hidden] { display: none; }
    .pop-head {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 15px 16px 12px; border-bottom: 1px solid var(--rule);
    }
    .pop-title { flex: 1; min-width: 0; }
    .pop-title b { display: block; font-size: 17px; letter-spacing: -.3px; }
    .pop-title span { display: block; margin-top: 2px; font-size: 12px; color: var(--ink-3); }
    .close {
      flex-shrink: 0; width: 28px; height: 28px; border: none; border-radius: 50%;
      background: rgba(118,118,128,.16); color: var(--ink-2);
      font-size: 15px; line-height: 1; cursor: pointer; font-family: inherit;
    }
    .close:hover { background: rgba(118,118,128,.28); }
    .pop-body { flex: 1; overflow-y: auto; padding: 14px 16px 18px; }

    .sec { margin-bottom: 20px; }
    .sec:last-child { margin-bottom: 4px; }
    .sec-t { font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 9px; }
    .sec-t span { display: block; margin-top: 2px; font-size: 11.5px;
                  font-weight: 400; color: var(--ink-4); }

    .price { font-size: 33px; font-weight: 700; letter-spacing: -1px;
             color: var(--accent); line-height: 1.1; }
    .price-cap { display: block; margin-top: 5px; font-size: 12px; color: var(--ink-3); }
    .chips { margin-top: 11px; display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { padding: 4px 11px; border-radius: 999px; font-size: 12px; font-weight: 500;
            background: rgba(194,102,10,.14); color: #8E4C06; }
    .chip.neutral { background: rgba(118,118,128,.14); color: var(--ink-2); }
    .chip.warn { background: rgba(255,59,48,.12); color: #A01B13; }
    .trim { margin-top: 13px; padding-top: 12px; border-top: 1px solid var(--rule);
            display: flex; gap: 10px; }
    .trim div { flex: 1; }
    .trim .k { font-size: 11px; color: var(--ink-4); }
    .trim .v { margin-top: 2px; font-size: 14.5px; font-weight: 600; }
    .trim .v.off { color: var(--ink-4); font-weight: 500; font-size: 12.5px; }

    .bars { display: flex; flex-direction: column; gap: 2px; }
    .bars.scroll { max-height: 268px; overflow-y: auto; padding-right: 4px; position: relative; }
    .bar-row { display: flex; align-items: center; gap: 8px; height: 24px; flex-shrink: 0; }
    .bar-name { width: 58px; flex-shrink: 0; font-size: 11.5px; color: var(--ink-2);
                text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-row.sel .bar-name { font-weight: 700; color: var(--ink); }
    .bar-track { flex: 1; min-width: 0; }
    .bar-fill { display: block; height: 11px; border-radius: 0 4px 4px 0; background: #8E8E93; }
    .bar-row.sel .bar-fill { background: var(--accent); }
    .bar-val { width: 54px; flex-shrink: 0; font-size: 11px; color: var(--ink-3);
               text-align: right; font-variant-numeric: tabular-nums; }
    .bar-row.sel .bar-val { color: var(--ink); font-weight: 600; }

    .chart { width: 100%; height: auto; display: block; overflow: visible; }
    .grid-line { stroke: rgba(60,60,67,.12); stroke-width: 1; }
    .axis-text { fill: var(--ink-4); font-size: 9px;
                 font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    .pt-label { fill: var(--ink-2); font-size: 9.5px; font-weight: 600;
                font-family: -apple-system, BlinkMacSystemFont, sans-serif; }

    .tablelink { margin-top: 10px; text-align: center; }
    .tablelink button { border: none; background: rgba(118,118,128,.14); color: var(--ink-2);
                        padding: 5px 13px; border-radius: 999px; font-size: 11.5px;
                        font-family: inherit; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 11.5px; }
    th, td { padding: 5px 4px; border-bottom: 1px solid var(--rule); text-align: right; }
    th:first-child, td:first-child { text-align: left; }
    th { color: var(--ink-4); font-weight: 500; }
    td { font-variant-numeric: tabular-nums; }

    .foot { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--rule);
            font-size: 10.5px; color: var(--ink-4); line-height: 1.7; }

    /* ── 좁은 화면: 팝업을 아래 시트로 ── */
    @media (max-width: 820px) {
      #panel { top: 10px; left: 10px; right: 10px; width: auto; }
      #legend { bottom: 10px; left: 10px; }
      #popup {
        top: auto; left: 0; right: 0; bottom: 0; width: auto;
        max-height: 68vh; border-radius: 18px 18px 0 0;
      }
      .results { max-height: 200px; }
    }
  </style>
</head>

<body>
  <div id="maplayer"></div>

  <div id="panel" class="glass">
    <div class="tabs">
      <button class="tab on" id="tab-search" data-action="tab" data-tab="search">검색</button>
      <button class="tab" id="tab-pick" data-action="tab" data-tab="pick">지명검색</button>
    </div>

    <div class="pane" id="pane-search">
      <div class="searchbox">
        <input id="q" type="text" placeholder="동 이름을 입력하세요. 예: 가락" autocomplete="off" py-input="on_query">
      </div>
      <div class="results" id="results"></div>
    </div>

    <div class="pane" id="pane-pick" hidden>
      <div class="field">
        <label for="gu">자치구</label>
        <span class="picker"><select id="gu" py-change="on_gu"></select><span class="chev">&#9662;</span></span>
      </div>
      <div class="field">
        <label for="dong">법정동</label>
        <span class="picker"><select id="dong" py-change="on_dong" disabled></select><span class="chev">&#9662;</span></span>
      </div>
      <div class="field">
        <label for="usg">주택 유형</label>
        <span class="picker"><select id="usg" py-change="on_usg" disabled></select><span class="chev">&#9662;</span></span>
      </div>
    </div>
  </div>

  <div id="legend" class="glass">
    <span>전세가 낮음</span>
    <span class="steps" id="legend-steps"></span>
    <span>높음</span>
  </div>

  <div id="popup" class="glass" hidden>
    <div class="pop-head">
      <div class="pop-title"><b id="pop-name"></b><span id="pop-sub"></span></div>
      <button class="close" data-action="close" aria-label="닫기">&#10005;</button>
    </div>
    <div class="pop-body" id="pop-body"></div>
  </div>

# ── 값 ────────────────────────────────────────────────────

def format_money(value):
    total = int(round(value))
    eok = total // 10000
    man = total % 10000
    if eok > 0:
        if man > 0:
            text = f"{eok}억 {man:,}만원"
        else:
            text = f"{eok}억원"
    else:
        text = f"{man:,}만원"
    return text


def short_money(value):
    eok = value / 10000
    if eok >= 10:
        text = f"{eok:.0f}억"
    elif eok >= 1:
        text = f"{eok:.1f}억"
    else:
        text = f"{int(round(value)):,}만"
    return text


def order_usg(keys):
    out = []
    for name in USG_ORDER:
        if name in keys:
            out.append(name)
    for name in sorted(keys):
        if name not in out:
            out.append(name)
    return out


def ramp_step(value, cuts):
    step = 0
    for i in range(len(cuts)):
        if value > cuts[i]:
            step = i + 1
    return step


def gu_cuts():
    values = sorted(GU[k][0] for k in GU)
    cuts = []
    for i in range(1, len(RAMP)):
        cuts.append(values[int(len(values) * i / len(RAMP))])
    return cuts


# ── 지도 ──────────────────────────────────────────────────

def draw_map():
    cuts = gu_cuts()
    names = sorted(SHAPES.keys())
    svg = f"<svg viewBox='0 0 {VIEWBOX[0]} {VIEWBOX[1]}' preserveAspectRatio='xMidYMid meet'"
    svg = svg + " role='img' aria-label='서울 자치구 평균 전세가 지도'>"
    for i in range(len(names)):
        name = names[i]
        color = RAMP[ramp_step(GU[name][0], cuts)]
        svg = svg + f"<path id='gu-{i}' class='gu' d='{SHAPES[name]}' fill='{color}'"
        svg = svg + f" data-action='pick-gu' data-gu='{name}'>"
        svg = svg + f"<title>{name} · {format_money(GU[name][0])}</title></path>"
    for i in range(len(names)):

# ── 조각 ──────────────────────────────────────────────────

def bar_list(rows, selected, scroll):
    top = 0
    for i in range(len(rows)):
        if rows[i][1] > top:
            top = rows[i][1]
    cls = "bars scroll" if scroll else "bars"
    html = f"<div class='{cls}'>"
    for i in range(len(rows)):
        name = rows[i][0]
        value = rows[i][1]
        width = 2 + 98 * value / top
        row_cls = "bar-row sel" if name == selected else "bar-row"
        html = html + f"<div class='{row_cls}'><span class='bar-name' title='{name}'>{name}</span>"
        html = html + f"<span class='bar-track'><span class='bar-fill' style='width:{width:.1f}%'></span></span>"
        html = html + f"<span class='bar-val'>{short_money(value)}</span></div>"
    return html + "</div>"


def line_chart(values, labels):
    w = 360
    h = 132
    pad_l = 10
    pad_r = 10
    pad_t = 22
    pad_b = 10
    low = min(values)
    high = max(values)
    span = high - low
    if span == 0:
        span = 1
    n = len(values)
    xs = []
    ys = []
    for i in range(n):
        xs.append(pad_l + (w - pad_l - pad_r) * i / (n - 1))
        ys.append(pad_t + (h - pad_t - pad_b) * (1 - (values[i] - low) / span))

    svg = f"<svg class='chart' viewBox='0 0 {w} {h + 16}' role='img' aria-label='월별 평균 전세가'>"
    svg = svg + f"<line class='grid-line' x1='{pad_l}' y1='{pad_t}' x2='{w-pad_r}' y2='{pad_t}'/>"
    svg = svg + f"<line class='grid-line' x1='{pad_l}' y1='{h-pad_b}' x2='{w-pad_r}' y2='{h-pad_b}'/>"
    points = ""
    for i in range(n):
        points = points + f"{xs[i]:.1f},{ys[i]:.1f} "
    svg = svg + f"<polyline points='{points}' fill='none' stroke='#C2660A' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/>"
    for i in range(n):
        svg = svg + f"<circle cx='{xs[i]:.1f}' cy='{ys[i]:.1f}' r='4' fill='#C2660A' stroke='#fff' stroke-width='2'>"
        svg = svg + f"<title>{labels[i]} · {format_money(values[i])}</title></circle>"
        if i == 0 or i == n - 1 or values[i] == high or values[i] == low:
            anchor = "start" if i == 0 else ("end" if i == n - 1 else "middle")
            svg = svg + f"<text class='pt-label' x='{xs[i]:.1f}' y='{ys[i]-10:.1f}' text-anchor='{anchor}'>{short_money(values[i])}</text>"
        if i % 2 == 0 or i == n - 1:
            anchor = "start" if i == 0 else ("end" if i == n - 1 else "middle")
            svg = svg + f"<text class='axis-text' x='{xs[i]:.1f}' y='{h+8}' text-anchor='{anchor}'>{labels[i]}</text>"
    return svg + "</svg>"


def monthly_table(labels, values):
    html = "<table><thead><tr><th>월</th><th>평균 전세가</th></tr></thead><tbody>"
    for i in range(len(labels)):
        html = html + f"<tr><td>{labels[i]}</td><td>{format_money(values[i])}</td></tr>"
    return html + "</tbody></table>"

def sec_summary(gu, dong, usg):
    row = DATA[gu][dong][usg]
    mean = row[0]
    count = row[1]
    trim = row[2]
    html = "<div class='sec'>"
    html = html + f"<div class='price'>{format_money(mean)}</div>"
    html = html + "<span class='price-cap'>평균 전세 보증금</span><div class='chips'>"
    ratio = mean / SEOUL[0] * 100
    html = html + f"<span class='chip'>서울 평균의 {ratio:.0f}%</span>"
    if count < 5:
        html = html + f"<span class='chip warn'>거래 {count}건 · 참고용</span>"
    else:
        html = html + f"<span class='chip neutral'>거래 {count:,}건</span>"
    html = html + "</div><div class='trim'>"
    html = html + f"<div><div class='k'>평균</div><div class='v'>{short_money(mean)}</div></div>"
    if trim is None:
        html = html + "<div><div class='k'>절사평균 10%</div><div class='v off'>거래 부족</div></div>"
    else:
        html = html + f"<div><div class='k'>절사평균 10%</div><div class='v'>{short_money(trim)}</div></div>"
    html = html + f"<div><div class='k'>서울 평균</div><div class='v'>{short_money(SEOUL[0])}</div></div>"
    return html + "</div></div>"


def sec_usg(gu, dong, usg):
    keys = order_usg(DATA[gu][dong].keys())
    rows = []
    for i in range(len(keys)):
        rows.append([keys[i], DATA[gu][dong][keys[i]][0]])
    html = f"<div class='sec'><div class='sec-t'>{dong} 주택 유형별 평균"
    html = html + "<span>같은 동 안에서 유형끼리 견줘 봅니다</span></div>"
    return html + bar_list(rows, usg, False) + "</div>"


def sec_rank(gu):
    names = sorted(GU.keys(), key=lambda k: GU[k][0], reverse=True)
    rows = []
    rank = 0
    for i in range(len(names)):
        rows.append([names[i], GU[names[i]][0]])
        if names[i] == gu:
            rank = i + 1
    html = "<div class='sec'><div class='sec-t'>자치구 평균 전세가 순위"
    html = html + f"<span>{gu}는 25개 자치구 가운데 {rank}위입니다</span></div>"
    return html + bar_list(rows, gu, True) + "</div>", rank


def sec_monthly(gu):
    values = MONTHLY[gu]
    change = (values[-1] - values[0]) / values[0] * 100
    if change >= 0:
        move = f"처음 달보다 {change:.1f}% 높습니다"
    else:
        move = f"처음 달보다 {-change:.1f}% 낮습니다"
    html = f"<div class='sec'><div class='sec-t'>{gu} 월별 평균 전세가"
    html = html + f"<span>{move} · 집계가 온전한 {len(values)}개월만</span></div>"
    html = html + line_chart(values, MONTH_LABELS)
    html = html + "<div class='tablelink'><button id='tbtn' data-action='toggle-table'>표로 보기</button></div>"
    html = html + f"<div id='mtable' hidden>{monthly_table(MONTH_LABELS, values)}</div>"
    return html + "</div>"


def render_popup():
    gu = state["gu"]

    for i in range(len(items)):
        html = html + f"<option value='{items[i]}'>{items[i]}</option>"
    box.innerHTML = html
    box.disabled = len(items) == 0


def value_of(select_id):
    return document.querySelector("#" + select_id).value


def set_gu(gu):
    state["gu"] = gu
    state["dong"] = ""
    state["usg"] = ""
    document.querySelector("#gu").value = gu
    if gu == "":
        fill("dong", [], "자치구 먼저")
        fill("usg", [], "법정동 먼저")
    else:
        fill("dong", sorted(DATA[gu].keys()), "선택")
        fill("usg", [], "법정동 먼저")
    highlight(gu)
    render_popup()


def set_place(gu, dong, usg):
    state["gu"] = gu
    state["dong"] = dong
    state["usg"] = usg
    document.querySelector("#gu").value = gu
    fill("dong", sorted(DATA[gu].keys()), "선택")
    document.querySelector("#dong").value = dong

# ── 검색 ──────────────────────────────────────────────────

def on_query(event):
    text = document.querySelector("#q").value.strip()
    box = document.querySelector("#results")
    if len(text) == 0:
        box.innerHTML = "<div class='empty'>동 이름을 입력하거나 지도를 누르세요</div>"
        return

    hits = []
    for gu in sorted(DATA.keys()):
        for dong in sorted(DATA[gu].keys()):
            if text in dong:
                hits.append([gu, dong, dong.find(text)])
            elif text in gu:
                hits.append([gu, dong, -1])
    hits.sort(key=lambda h: (h[2] != 0, len(h[1]), h[1]))

    if len(hits) == 0:
        box.innerHTML = f"<div class='empty'>'{text}' 에 맞는 동이 없습니다</div>"
        return

    html = ""
    shown = hits[:40]
    for i in range(len(shown)):
        gu = shown[i][0]
        dong = shown[i][1]
        at = shown[i][2]
        if at >= 0:
            label = dong[:at] + "<em>" + dong[at:at + len(text)] + "</em>" + dong[at + len(text):]
        else:
            label = dong
        html = html + f"<div class='result' data-action='pick-place' data-gu='{gu}' data-dong='{dong}'>"
        html = html + f"<span>{label}</span><span class='r-sub'>{gu}</span></div>"
    if len(hits) > len(shown):
        html = html + f"<div class='empty'>그 밖에 {len(hits) - len(shown)}곳 더 있습니다</div>"
    box.innerHTML = html


# ── 클릭 처리 ──────────────────────────────────────────────

def show_tab(name):
    document.querySelector("#pane-search").hidden = name != "search"
    document.querySelector("#pane-pick").hidden = name != "pick"
    document.querySelector("#tab-search").setAttribute("class", "tab on" if name == "search" else "tab")
    document.querySelector("#tab-pick").setAttribute("class", "tab on" if name == "pick" else "tab")


def toggle_table():
    table = document.querySelector("#mtable")
    table.hidden = not table.hidden
    document.querySelector("#tbtn").innerHTML = "표 접기" if not table.hidden else "표로 보기"


def on_click(event):
    node = event.target.closest("[data-action]")
    if not node:
        return
    action = node.getAttribute("data-action")
    if action == "pick-gu":
        set_gu(node.getAttribute("data-gu"))
    elif action == "pick-place":
        gu = node.getAttribute("data-gu")
        dong = node.getAttribute("data-dong")
        set_place(gu, dong, order_usg(DATA[gu][dong].keys())[0])
    elif action == "tab":
        show_tab(node.getAttribute("data-tab"))
    elif action == "toggle-table":
        toggle_table()
    elif action == "close":
        document.querySelector("#popup").hidden = True


document.body.onclick = on_click
