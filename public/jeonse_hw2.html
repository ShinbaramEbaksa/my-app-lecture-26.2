<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>서울 전세가 대시보드</title>

  <link rel="stylesheet" href="https://pyscript.net/releases/2025.8.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2025.8.1/core.js"></script>

  <style>
    :root {
      --accent: #FF9500;        /* UI 강조 (데이터 마크 아님) */
      --mark: #C2660A;          /* 데이터 마크 - 선택 */
      --mark-off: #8E8E93;      /* 데이터 마크 - 비선택 */
      --ink: #1c1c1e;
      --ink-2: #48484a;
      --ink-3: #6b6b70;
      --ink-4: rgba(60, 60, 67, 0.42);
      --glass: rgba(255, 255, 255, 0.55);
      --glass-strong: rgba(255, 255, 255, 0.78);
      --edge: rgba(255, 255, 255, 0.85);
      --rule: rgba(60, 60, 67, 0.1);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 44px 18px 72px;
      color: var(--ink);
      background: #f2f1f6;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
                   "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow-x: hidden;
    }

    .blob { position: fixed; border-radius: 50%; filter: blur(80px); opacity: .5; pointer-events: none; z-index: 0; }
    .blob.one   { width: 380px; height: 380px; background: #FFB340; top: -100px; left: -70px; }
    .blob.two   { width: 320px; height: 320px; background: #FF7A5A; top: 220px; right: -100px; }
    .blob.three { width: 420px; height: 420px; background: #7FC8FF; bottom: -160px; left: 18%; }

    .wrap { position: relative; z-index: 1; max-width: 500px; margin: 0 auto; }

    header { padding: 0 6px 20px; }
    h1 { margin: 0 0 6px; font-size: 29px; font-weight: 700; letter-spacing: -.4px; }
    .sub { margin: 0; font-size: 14px; color: var(--ink-3); line-height: 1.55; }

    .card {
      background: var(--glass);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border: 1px solid var(--edge);
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(31,38,60,.12), inset 0 1px 0 rgba(255,255,255,.6);
      margin-bottom: 16px;
    }

    .picker-card { padding: 6px; }

    .field {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 13px 15px; border-bottom: 1px solid var(--rule);
    }
    .field:last-child { border-bottom: none; }
    .field label { flex-shrink: 0; font-size: 16px; font-weight: 500; }

    .picker { position: relative; flex: 1; max-width: 62%; }
    select {
      width: 100%; appearance: none; -webkit-appearance: none;
      padding: 9px 32px 9px 13px; font-size: 16px; font-family: inherit;
      color: var(--ink); background: rgba(118,118,128,.12);
      border: none; border-radius: 10px; cursor: pointer;
      text-align: right; direction: rtl;
    }
    select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    select:disabled { color: rgba(60,60,67,.3); cursor: not-allowed; }
    .chev { position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
            color: rgba(60,60,67,.45); font-size: 13px; pointer-events: none; }

    /* ── 보드 공통 ── */
    .board { padding: 18px 20px 20px; }
    .board-head { margin-bottom: 14px; }
    .board-title { font-size: 13px; font-weight: 600; color: var(--ink-2); letter-spacing: -.1px; }
    .board-note { display: block; margin-top: 3px; font-size: 12px; color: var(--ink-4); }

    /* ── 보드1 요약 ── */
    .summary { background: var(--glass-strong); text-align: center; padding: 26px 22px 22px; }
    .place { font-size: 14px; color: var(--ink-3); margin-bottom: 9px; }
    .price { font-size: 37px; font-weight: 700; letter-spacing: -1px; color: var(--mark); line-height: 1.12; }
    .price-cap { display: block; margin-top: 7px; font-size: 13px; color: var(--ink-3); }
    .chips { margin-top: 15px; display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; }
    .chip {
      padding: 5px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 500;
      background: rgba(255,149,0,.16); color: #9A5200;
    }
    .chip.neutral { background: rgba(118,118,128,.14); color: var(--ink-2); }
    .chip.warn { background: rgba(255,59,48,.12); color: #A01B13; }

    .trim {
      margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--rule);
      display: flex; justify-content: space-around; gap: 10px;
    }
    .trim div { flex: 1; }
    .trim .k { font-size: 11.5px; color: var(--ink-4); }
    .trim .v { margin-top: 3px; font-size: 15px; font-weight: 600; color: var(--ink); }
    .trim .v.off { color: var(--ink-4); font-weight: 500; font-size: 13px; }

    /* ── 막대 ── */
    .bars { display: flex; flex-direction: column; gap: 2px; }
    .bars.scroll { max-height: 304px; overflow-y: auto; padding-right: 4px; }
    .bar-row { display: flex; align-items: center; gap: 9px; height: 24px; }
    .bar-name { width: 62px; flex-shrink: 0; font-size: 12px; color: var(--ink-2);
                text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-row.sel .bar-name { font-weight: 700; color: var(--ink); }
    .bar-track { flex: 1; min-width: 0; }
    .bar-fill { display: block; height: 11px; border-radius: 0 4px 4px 0; background: var(--mark-off); }
    .bar-row.sel .bar-fill { background: var(--mark); }
    .bar-val { width: 78px; flex-shrink: 0; font-size: 11.5px; color: var(--ink-3);
               text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .bar-row.sel .bar-val { color: var(--ink); font-weight: 600; }

    /* ── 추이 ── */
    .chart { width: 100%; height: auto; display: block; overflow: visible; }
    .grid-line { stroke: rgba(60,60,67,.12); stroke-width: 1; }
    .axis-text { fill: var(--ink-4); font-size: 9px;
                 font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    .pt-label { fill: var(--ink-2); font-size: 9.5px; font-weight: 600;
                font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    .hit { fill: transparent; cursor: crosshair; }

    .hint { padding: 32px 10px; text-align: center; color: var(--ink-3); font-size: 15px; line-height: 1.6; }

    .tablelink {
      margin-top: 12px; text-align: center; font-size: 12px;
    }
    .tablelink button {
      border: none; background: rgba(118,118,128,.14); color: var(--ink-2);
      padding: 6px 14px; border-radius: 999px; font-size: 12px;
      font-family: inherit; cursor: pointer;
    }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 12px; }
    th, td { padding: 6px 4px; border-bottom: 1px solid var(--rule); text-align: right; }
    th:first-child, td:first-child { text-align: left; }
    th { color: var(--ink-4); font-weight: 500; }
    td { font-variant-numeric: tabular-nums; }

    footer { margin-top: 24px; text-align: center; font-size: 11.5px;
             color: rgba(60,60,67,.45); line-height: 1.75; }

    @media (max-width: 380px) {
      h1 { font-size: 25px; }
      .price { font-size: 31px; }
      .bar-name { width: 54px; }
      .bar-val { width: 68px; font-size: 11px; }
    }
  </style>
</head>

  <div class="wrap">
    <header>
      <h1>서울 전세가 대시보드</h1>
      <p class="sub">자치구와 법정동, 주택 유형을 고르면<br>평균 전세 보증금을 서울 전체와 견줘 보여 줍니다.</p>
    </header>

    <div class="card picker-card">
      <div class="field">
        <label for="gu">자치구</label>
        <span class="picker"><select id="gu" py-change="on_gu"></select><span class="chev">&#9662;</span></span>
      </div>
      <div class="field">
        <label for="dong">법정동</label>
        <span class="picker"><select id="dong" py-change="on_dong" disabled></select><span class="chev">&#9662;</span></span>
      </div>
      <div class="field">
        <label for="usg">주택 유형</label>
        <span class="picker"><select id="usg" py-change="on_usg" disabled></select><span class="chev">&#9662;</span></span>
      </div>
    </div>

    <div class="card summary" id="board1"><div class="hint">불러오는 중입니다.</div></div>
    <div class="card board" id="board3" hidden></div>
    <div class="card board" id="board2" hidden></div>
    <div class="card board" id="board4" hidden></div>

    <footer>
      출처: 서울 열린데이터 광장 · 서울시 부동산 전월세가 정보<br>
      2025년 11월 ~ 2026년 8월 확정신고 전세 계약 121,659건 기준
    </footer>
  </div>

# ── 값 다루기 ──────────────────────────────────────────────

def format_money(value):
    total = int(round(value))
    eok = total // 10000
    man = total % 10000
    if eok > 0:
        if man > 0:
            text = f"{eok}억 {man:,}만원"
        else:
            text = f"{eok}억원"
    else:
        text = f"{man:,}만원"
    return text


def short_money(value):
    """막대 옆에 들어갈 짧은 표기"""
    eok = value / 10000
    if eok >= 10:
        text = f"{eok:.0f}억"
    elif eok >= 1:
        text = f"{eok:.1f}억"
    else:
        text = f"{int(round(value)):,}만"
    return text


def order_usg(keys):
    """아파트 → 오피스텔 → 연립다세대 → 단독다가구 순서로"""
    out = []
    for name in USG_ORDER:
        if name in keys:
            out.append(name)
    for name in sorted(keys):
        if name not in out:
            out.append(name)
    return out


# ── 그리기 조각 ────────────────────────────────────────────

def bar_list(rows, selected, scroll):
    """rows: [이름, 값] 목록. 가장 큰 값을 100%로"""
    top = 0
    for i in range(len(rows)):
        if rows[i][1] > top:
            top = rows[i][1]
    cls = "bars scroll" if scroll else "bars"
    html = f"<div class='{cls}'>"
    for i in range(len(rows)):
        name = rows[i][0]
        value = rows[i][1]
        width = 2 + 98 * value / top
        row_cls = "bar-row sel" if name == selected else "bar-row"
        html = html + f"<div class='{row_cls}'>"
        html = html + f"<span class='bar-name' title='{name}'>{name}</span>"
        html = html + f"<span class='bar-track'><span class='bar-fill' style='width:{width:.1f}%'></span></span>"
        html = html + f"<span class='bar-val'>{short_money(value)}</span>"
        html = html + "</div>"
    return html + "</div>"


def line_chart(values, labels):
    """월별 추이 꺾은선. 점마다 title로 값을 보여 준다"""
    w = 460
    h = 150
    pad_l = 8
    pad_r = 8
    pad_t = 22
    pad_b = 10

    low = min(values)
    high = max(values)
    span = high - low
    if span == 0:
        span = 1

    xs = []
    ys = []
    n = len(values)
    for i in range(n):
        x = pad_l + (w - pad_l - pad_r) * i / (n - 1)
        y = pad_t + (h - pad_t - pad_b) * (1 - (values[i] - low) / span)
        xs.append(x)
        ys.append(y)

    svg = f"<svg class='chart' viewBox='0 0 {w} {h + 16}' role='img' aria-label='월별 평균 전세가 추이'>"
    svg = svg + f"<line class='grid-line' x1='{pad_l}' y1='{pad_t}' x2='{w - pad_r}' y2='{pad_t}'/>"
    svg = svg + f"<line class='grid-line' x1='{pad_l}' y1='{h - pad_b}' x2='{w - pad_r}' y2='{h - pad_b}'/>"

    points = ""
    for i in range(n):
        points = points + f"{xs[i]:.1f},{ys[i]:.1f} "
    svg = svg + f"<polyline points='{points}' fill='none' stroke='#C2660A' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/>"

    for i in range(n):
        svg = svg + f"<circle cx='{xs[i]:.1f}' cy='{ys[i]:.1f}' r='4' fill='#C2660A' stroke='#ffffff' stroke-width='2'>"
        svg = svg + f"<title>{labels[i]} · {format_money(values[i])}</title></circle>"
        if i == 0 or i == n - 1 or values[i] == high or values[i] == low:
            anchor = "start" if i == 0 else ("end" if i == n - 1 else "middle")
            svg = svg + f"<text class='pt-label' x='{xs[i]:.1f}' y='{ys[i] - 10:.1f}' text-anchor='{anchor}'>{short_money(values[i])}</text>"
        if i % 2 == 0 or i == n - 1:
            anchor = "start" if i == 0 else ("end" if i == n - 1 else "middle")
            svg = svg + f"<text class='axis-text' x='{xs[i]:.1f}' y='{h + 8}' text-anchor='{anchor}'>{labels[i]}</text>"

    return svg + "</svg>"


def monthly_table(labels, values):
    html = "<table><thead><tr><th>월</th><th>평균 전세가</th></tr></thead><tbody>"
    for i in range(len(labels)):
        html = html + f"<tr><td>{labels[i]}</td><td>{format_money(values[i])}</td></tr>"
    return html + "</tbody></table>"

def board_summary(gu, dong, usg):
    row = DATA[gu][dong][usg]
    mean = row[0]
    count = row[1]
    trim = row[2]

    html = f"<div class='place'>{gu} {dong} · {usg}</div>"
    html = html + f"<div class='price'>{format_money(mean)}</div>"
    html = html + "<span class='price-cap'>평균 전세 보증금</span>"

    html = html + "<div class='chips'>"
    ratio = mean / SEOUL[0] * 100
    if ratio >= 100:
        html = html + f"<span class='chip'>서울 평균의 {ratio:.0f}%</span>"
    else:
        html = html + f"<span class='chip neutral'>서울 평균의 {ratio:.0f}%</span>"
    if count < 5:
        html = html + f"<span class='chip warn'>거래 {count}건 · 참고용</span>"
    else:
        html = html + f"<span class='chip neutral'>거래 {count:,}건</span>"
    html = html + "</div>"

    html = html + "<div class='trim'>"
    html = html + f"<div><div class='k'>평균</div><div class='v'>{short_money(mean)}</div></div>"
    if trim is None:
        html = html + "<div><div class='k'>절사평균 10%</div><div class='v off'>거래 부족</div></div>"
    else:
        html = html + f"<div><div class='k'>절사평균 10%</div><div class='v'>{short_money(trim)}</div></div>"
    html = html + f"<div><div class='k'>서울 평균</div><div class='v'>{short_money(SEOUL[0])}</div></div>"
    html = html + "</div>"

    document.querySelector("#board1").innerHTML = html
