<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>서울 전세가 지도</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">

  <style>
    :root {
      --ink: #1c1c1e;
      --ink-2: #48484a;
      --ink-3: #6b6b70;
      --ink-4: rgba(60, 60, 67, .45);
      --rule: rgba(60, 60, 67, .12);
      --accent: #B5321F;
      --glass: rgba(255, 255, 255, .62);
      --edge: rgba(255, 255, 255, .9);
      --shadow: 0 10px 40px rgba(31, 38, 60, .18);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background: #eceef2;
      font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #map { position: fixed; inset: 0; z-index: 0; background: #eceef2; }
    path.gu { cursor: pointer; transition: stroke-width .12s ease; }
    path.gu:hover { stroke: #1c1c1e; stroke-width: 2.5; }
    path.gu.sel { stroke: #1c1c1e; stroke-width: 3; }

    .glass {
      background: var(--glass);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--edge);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .7);
    }

    #basemap {
      position: fixed; z-index: 3; right: 16px; bottom: 26px;
      display: flex; gap: 3px; padding: 4px; border-radius: 13px;
    }
    #basemap button {
      border: none; background: transparent; color: var(--ink-3);
      font-family: inherit; font-size: 12.5px; font-weight: 500;
      padding: 7px 13px; border-radius: 10px; cursor: pointer;
    }
    #basemap button.on { background: var(--accent); color: #fff; font-weight: 700; }

    #legend {
      position: fixed; z-index: 3; left: 16px; bottom: 26px;
      padding: 9px 13px; border-radius: 13px;
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; color: var(--ink-3);
    }
    #legend .steps { display: flex; gap: 2px; }
    #legend .steps span { width: 24px; height: 9px; border-radius: 2px; }

    .leaflet-control-attribution { font-family: inherit; font-size: 10px; }

    /* 팝업은 지도 오른쪽을 덮는다. 전환 버튼과 저작자 표시를 그 왼쪽으로 비켜 놓는다. */
    body:has(#popup:not([hidden])) #basemap { right: 430px; }
    body:has(#popup:not([hidden])) .leaflet-control-attribution { margin-right: 414px; }

    #panel {
      position: fixed; z-index: 4; top: 16px; left: 16px; width: 308px;
      border-radius: 17px; overflow: hidden;
    }
    .tabs { display: flex; gap: 3px; padding: 7px 7px 0; }
    .tab {
      flex: 1; padding: 8px 4px; border: none; border-radius: 10px;
      background: transparent; color: var(--ink-3);
      font-family: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
    }
    .tab.on { background: var(--accent); color: #fff; }
    .pane { padding: 10px 12px 12px; }
    .pane[hidden] { display: none; }

    #q {
      width: 100%; padding: 10px 12px; font-size: 15px; font-family: inherit;
      color: var(--ink); background: rgba(118, 118, 128, .12);
      border: 1px solid transparent; border-radius: 10px;
    }
    #q:focus { outline: none; border-color: var(--accent); background: #fff; }
    .results { margin-top: 8px; max-height: 254px; overflow-y: auto; }
    .result {
      display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
      padding: 9px 10px; border-radius: 9px; cursor: pointer; font-size: 14px;
    }
    .result:hover { background: rgba(181, 50, 31, .1); }
    .result .r-sub { font-size: 11.5px; color: var(--ink-4); flex-shrink: 0; }
    .result em { font-style: normal; color: var(--accent); font-weight: 700; }
    .empty { padding: 14px 4px; font-size: 13px; color: var(--ink-4); text-align: center; }

    .field { display: flex; align-items: center; justify-content: space-between;
             gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--rule); }
    .field:last-child { border-bottom: none; }
    .field label { font-size: 14px; font-weight: 500; flex-shrink: 0; }
    .picker { position: relative; flex: 1; max-width: 64%; }
    select {
      width: 100%; appearance: none; -webkit-appearance: none;
      padding: 8px 28px 8px 11px; font-size: 14px; font-family: inherit;
      color: var(--ink); background: rgba(118, 118, 128, .12);
      border: none; border-radius: 9px; cursor: pointer; text-align: right; direction: rtl;
    }
    select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    select:disabled { color: rgba(60, 60, 67, .3); cursor: not-allowed; }
    .chev { position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            color: var(--ink-4); font-size: 12px; pointer-events: none; }

    #popup {
      position: fixed; z-index: 4; top: 16px; right: 16px; bottom: 16px; width: 398px;
      border-radius: 18px; display: flex; flex-direction: column; overflow: hidden;
    }
    #popup[hidden] { display: none; }
    .pop-head { display: flex; align-items: flex-start; gap: 10px;
                padding: 15px 16px 12px; border-bottom: 1px solid var(--rule); }
    .pop-title { flex: 1; min-width: 0; }
    .pop-title b { display: block; font-size: 17px; letter-spacing: -.3px; }
    .pop-title span { display: block; margin-top: 2px; font-size: 12px; color: var(--ink-3); }
    .close { flex-shrink: 0; width: 28px; height: 28px; border: none; border-radius: 50%;
             background: rgba(118, 118, 128, .16); color: var(--ink-2);
             font-size: 14px; line-height: 1; cursor: pointer; font-family: inherit; }
    .close:hover { background: rgba(118, 118, 128, .3); }
    .pop-body { flex: 1; overflow-y: auto; padding: 14px 16px 18px; }

    .sec { margin-bottom: 20px; }
    .sec:last-child { margin-bottom: 4px; }
    .sec-t { font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 9px; }
    .sec-t span { display: block; margin-top: 2px; font-size: 11.5px; font-weight: 400; color: var(--ink-4); }

    .price { font-size: 33px; font-weight: 700; letter-spacing: -1px; color: var(--accent); line-height: 1.1; }
    .price-cap { display: block; margin-top: 5px; font-size: 12px; color: var(--ink-3); }
    .chips { margin-top: 11px; display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { padding: 4px 11px; border-radius: 999px; font-size: 12px; font-weight: 500;
            background: rgba(181, 50, 31, .13); color: #8E2718; }
    .chip.neutral { background: rgba(118, 118, 128, .14); color: var(--ink-2); }
    .chip.warn { background: rgba(255, 149, 0, .18); color: #8A4B00; }
    .trim { margin-top: 13px; padding-top: 12px; border-top: 1px solid var(--rule); display: flex; gap: 10px; }
    .trim div { flex: 1; }
    .trim .k { font-size: 11px; color: var(--ink-4); }
    .trim .v { margin-top: 2px; font-size: 14.5px; font-weight: 600; }
    .trim .v.off { color: var(--ink-4); font-weight: 500; font-size: 12.5px; }

    .bars { display: flex; flex-direction: column; gap: 2px; }
    .bars.scroll { max-height: 268px; overflow-y: auto; padding-right: 4px; position: relative; }
    .bar-row { display: flex; align-items: center; gap: 7px; height: 24px; flex-shrink: 0; }
    .bar-name { width: 58px; flex-shrink: 0; font-size: 11.5px; color: var(--ink-2);
                text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-row.sel .bar-name { font-weight: 700; color: var(--ink); }
    .bar-track { flex: 1; min-width: 0; }
    .bar-fill { display: block; height: 11px; border-radius: 0 4px 4px 0; background: #8E8E93; }
    .bar-row.sel .bar-fill { background: var(--accent); }
    .bar-val { width: 46px; flex-shrink: 0; font-size: 11px; color: var(--ink-3);
               text-align: right; font-variant-numeric: tabular-nums; }
    .bar-row.sel .bar-val { color: var(--ink); font-weight: 600; }
    .bar-count { width: 42px; flex-shrink: 0; font-size: 10px; color: var(--ink-4); text-align: right; }
    .bar-row.thin .bar-count { color: #8A4B00; font-weight: 600; }
    .fold { padding: 5px 0; text-align: center; font-size: 11px; color: var(--ink-4); }

    .chart { width: 100%; height: auto; display: block; overflow: visible; }
    .grid-line { stroke: rgba(60, 60, 67, .12); stroke-width: 1; }
    .axis-text { fill: var(--ink-4); font-size: 9px; font-family: inherit; }
    .pt-label { fill: var(--ink-2); font-size: 9.5px; font-weight: 600; font-family: inherit; }

    .tablelink { margin-top: 10px; text-align: center; }
    .tablelink button { border: none; background: rgba(118, 118, 128, .14); color: var(--ink-2);
                        padding: 5px 13px; border-radius: 999px; font-size: 11.5px;
                        font-family: inherit; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 11.5px; }
    th, td { padding: 5px 4px; border-bottom: 1px solid var(--rule); text-align: right; }
    th:first-child, td:first-child { text-align: left; }
    th { color: var(--ink-4); font-weight: 500; }
    td { font-variant-numeric: tabular-nums; }
    #news-list { max-height: 246px; overflow-y: auto; }
    a.news { display: block; padding: 9px 10px; border-radius: 9px; text-decoration: none; color: inherit; }
    a.news:hover { background: rgba(181, 50, 31, .1); }
    .news-t { display: block; font-size: 13.5px; line-height: 1.45; }
    .news-m { display: block; margin-top: 3px; font-size: 11px; color: var(--ink-4); }
    #news-sources { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--rule); }
    .src-t { font-size: 11px; color: var(--ink-4); margin-bottom: 5px; }
    #news-sources a { display: block; padding: 6px 10px; border-radius: 8px;
                      font-size: 13px; color: var(--ink-2); text-decoration: none; }
    #news-sources a:hover { background: rgba(118, 118, 128, .14); }

    .foot { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--rule);
            font-size: 10.5px; color: var(--ink-4); line-height: 1.7; }


    /* 좁은 화면: 패널은 위, 결과는 아래 시트, 지도 전환은 시트 위로 */
    @media (max-width: 820px) {
      #panel { top: 10px; left: 10px; right: 10px; width: auto; max-height: 30vh; display: flex;
               flex-direction: column; }
      .pane { overflow-y: auto; }
      .results, #news-list { max-height: none; }
      #legend { left: 10px; bottom: 14px; }
      #basemap { right: 10px; bottom: 14px; }
      #popup {
        top: auto; left: 0; right: 0; bottom: 0; width: auto;
        max-height: 54vh; border-radius: 18px 18px 0 0;
      }
      /* 패널은 위 30vh, 시트는 아래 54vh. 그 사이 띠에 컨트롤과 저작자 표시를 둔다. */
      body:has(#popup:not([hidden])) #legend { bottom: calc(54vh + 56px); }
      body:has(#popup:not([hidden])) #basemap { right: 10px; bottom: calc(54vh + 10px); }
      body:has(#popup:not([hidden])) .leaflet-control-attribution {
        margin-right: 0; margin-bottom: calc(54vh + 4px);
      }
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <div id="panel" class="glass">
    <div class="tabs">
      <button class="tab on" id="tab-search" data-tab="search">검색</button>
      <button class="tab" id="tab-pick" data-tab="pick">지명검색</button>
      <button class="tab" id="tab-news" data-tab="news">정책·뉴스</button>
    </div>

    <div class="pane" id="pane-search">
      <input id="q" type="text" placeholder="동 이름을 입력하세요. 예: 가락" autocomplete="off">
      <div class="results" id="results"></div>
    </div>

    <div class="pane" id="pane-pick" hidden>
      <div class="field">
        <label for="gu">자치구</label>
        <span class="picker"><select id="gu"></select><span class="chev">&#9662;</span></span>
      </div>
      <div class="field">
        <label for="dong">법정동</label>
        <span class="picker"><select id="dong" disabled></select><span class="chev">&#9662;</span></span>
      </div>
      <div class="field">
        <label for="usg">주택 유형</label>
        <span class="picker"><select id="usg" disabled></select><span class="chev">&#9662;</span></span>
      </div>
    </div>

    <div class="pane" id="pane-news" hidden>
      <div id="news-list"></div>
      <div id="news-sources"></div>
    </div>
  </div>

  <div id="popup" class="glass" hidden>
    <div class="pop-head">
      <div class="pop-title"><b id="pop-name"></b><span id="pop-sub"></span></div>
      <button class="close" id="pop-close" aria-label="닫기">&#10005;</button>
    </div>
    <div class="pop-body" id="pop-body"></div>
  </div>

  <div id="legend" class="glass">
    <span>전세가 낮음</span>
    <span class="steps" id="legend-steps"></span>
    <span>높음</span>
  </div>

  <div id="basemap" class="glass">
    <button id="base-osm" class="on">일반지도</button>
    <button id="base-satellite">위성지도</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <script src="jeonse_hw2.js"></script>
</body>
</html>
